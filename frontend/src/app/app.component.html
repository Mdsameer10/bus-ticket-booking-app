<header class="site-header">
  <a class="brand" routerLink="/" aria-label="Intercity home">
    <span class="brand-icon" aria-hidden="true">IB</span>
    <span class="brand-copy">
      <strong>Intercity</strong>
      <small>Bus travel, made simple</small>
    </span>
  </a>

  <nav class="site-nav" aria-label="Main navigation">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Search trips</a>
    <a routerLink="/lookup" routerLinkActive="active">Manage booking</a>
  </nav>
</header>

<main class="main-content">
  <router-outlet></router-outlet>
</main>

<footer class="site-footer">
  <span>Intercity Bus Booking</span>
  <span>Sample schedules for demonstration · No payment collected</span>
</footer>
